<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Tasks - Lala Tech</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2 class="logo-text">LALA TECH</h2>
        <nav class="nav-menu">
          <a href="#" class="nav-item active"
            ><i data-lucide="check-square"></i> My Tasks</a
          >
          <a href="#" class="nav-item"
            ><i data-lucide="bell"></i> Notifications
            <span class="badge">2</span></a
          >
          <a href="index.html" class="nav-item logout-link"
            ><i data-lucide="log-out"></i> Logout</a
          >
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Quick Add Bar -->
        <header class="top-bar">
          <div class="quick-add">
            <i data-lucide="plus-circle"></i>
            <input
              type="text"
              placeholder="Add a new task for yourself... (Press Enter)"
              class="input quick-add-input"
            />
          </div>
        </header>

        <div class="dashboard-content">
          <h1 class="page-title">My Tasks</h1>

          <!-- Kanban Board Placeholder -->
          <div class="kanban-board">
            <div class="kanban-column">
              <h3>Open</h3>
              <div class="task-card card">
                <h4>Update client spreadsheet</h4>
                <span class="status-pill open">Open</span>
              </div>
            </div>
            <div class="kanban-column">
              <h3>In Progress</h3>
              <div class="task-card card">
                <h4>Call supplier for parts</h4>
                <span class="status-pill progress">In Progress</span>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script>
      lucide.createIcons();
    </script>
    <script src="js/dashboard-employee.js" type="module"></script>
    <script>lucide.createIcons();</script>
    <script src="js/dashboard-admin.js" type="module"></script>
    <script>lucide.createIcons();</script>
</body>
</body>
  </body>
</html>

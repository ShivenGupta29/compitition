<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Lala Tech Ops</title>
    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body class="login-body">
    <div class="login-card card">
      <h1 class="logo">LALA TECH <span>OPS</span></h1>
      <p class="subtitle">Sign in to your workspace</p>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input
            type="email"
            placeholder="name@lalatech.com"
            value="demo@lalatech.com"
            class="input"
          />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            placeholder="••••••••"
            value="password123"
            class="input"
          />
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary full-width">
          Sign In
        </button>
      </form>
    </div>

    <script src="js/auth.js" type="module"></script>
  </body>
</html>
